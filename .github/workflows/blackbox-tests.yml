name: Blackbox Tests

on:
  pull_request:
    paths:
      - 'blackbox/**'
      - 'enos/**'
      - '.github/workflows/blackbox-tests.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  blackbox-smoke-test:
    name: Blackbox Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Verify test compilation
        run: |
          echo "Compiling blackbox tests..."
          go test -c -tags=blackbox ./blackbox
          ls -lh blackbox.test
          echo "✅ Tests compiled successfully"

      - name: Run smoke test
        run: |
          echo "Running smoke test (TestBasicSmoke)..."
          gotestsum --junitfile=test-results.xml --format=testname -- \
            -v -timeout=5m -tags=blackbox -run=TestBasicSmoke ./blackbox

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@82082dac68ad6a19d980f8ce817e108b9f496c2a # v2.18.0
        if: always()
        with:
          files: test-results.xml
          check_name: Blackbox Test Results
          comment_mode: off

      - name: Upload test results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: blackbox-test-results
          path: |
            test-results.xml
            blackbox.test
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "## Blackbox Test Summary"
            echo ""
            echo "✅ Test compilation: Success"
            echo "✅ Smoke test execution: Complete"
            echo ""
            echo "**Note**: This workflow runs only the smoke test. Full test suite with Enos infrastructure will be added in Task 1.3b."
          } >> "$GITHUB_STEP_SUMMARY"
